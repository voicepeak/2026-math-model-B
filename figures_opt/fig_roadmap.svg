   <g id="text_1">
    <text style="font-size: 8px; font-family: 'SimSun', 'Microsoft YaHei', 'SimHei', 'DejaVu Sans', sans-serif; text-anchor: middle; fill: #222222" x="208.08" y="27.57286" transform="rotate(-0 208.08 27.57286)">数据与假设：1800 m圆域｜示向误差±1°（有界）｜接收半径1000—1500 m｜光学定位20 m、近距5 m</text>
   </g>
   <g id="text_2">
    <text style="font-size: 8px; font-family: 'SimSun', 'Microsoft YaHei', 'SimHei', 'DejaVu Sans', sans-serif; fill: #222222" transform="translate(46.4244 60.044565)">问题一</text>
    <text style="font-size: 8px; font-family: 'SimSun', 'Microsoft YaHei', 'SimHei', 'DejaVu Sans', sans-serif; fill: #222222" transform="translate(42.4244 70.319565)">集合定位</text>
    <text style="font-size: 8px; font-family: 'SimSun', 'Microsoft YaHei', 'SimHei', 'DejaVu Sans', sans-serif; fill: #222222" transform="translate(14.4244 80.50394)">楔形求交→凸包→衰退锥</text>
    <text style="font-size: 8px; font-family: 'SimSun', 'Microsoft YaHei', 'SimHei', 'DejaVu Sans', sans-serif; fill: #222222" transform="translate(28.4244 90.733628)">直径=最大顶点对</text>
    <text style="font-size: 8px; font-family: 'SimSun', 'Microsoft YaHei', 'SimHei', 'DejaVu Sans', sans-serif; fill: #222222" transform="translate(18.4244 100.963315)">覆盖判别用最小包围圆</text>
   </g>
   <g id="text_3">
    <text style="font-size: 8px; font-family: 'SimSun', 'Microsoft YaHei', 'SimHei', 'DejaVu Sans', sans-serif; fill: #222222" transform="translate(146.8644 59.976596)">问题二</text>
    <text style="font-size: 8px; font-family: 'SimSun', 'Microsoft YaHei', 'SimHei', 'DejaVu Sans', sans-serif; fill: #222222" transform="translate(138.8644 70.251596)">保证接收区</text>
    <text style="font-size: 8px; font-family: 'SimSun', 'Microsoft YaHei', 'SimHei', 'DejaVu Sans', sans-serif; fill: #222222" transform="translate(118.8644 80.526596)">首次接收收紧半径下界</text>
    <text style="font-size: 8px; font-family: 'SimSun', 'Microsoft YaHei', 'SimHei', 'DejaVu Sans', sans-serif; fill: #222222" transform="translate(122.8644 90.801596)">连续判据→有限检验</text>
    <text style="font-size: 8px; font-family: 'SimSun', 'Microsoft YaHei', 'SimHei', 'DejaVu Sans', sans-serif; fill: #222222" transform="translate(118.8644 101.031284)">有限场景最坏直径优选</text>
   </g>
   <g id="text_4">
    <text style="font-size: 8px; font-family: 'SimSun', 'Microsoft YaHei', 'SimHei', 'DejaVu Sans', sans-serif; fill: #222222" transform="translate(247.3044 59.908627)">问题三</text>
    <text style="font-size: 8px; font-family: 'SimSun', 'Microsoft YaHei', 'SimHei', 'DejaVu Sans', sans-serif; fill: #222222" transform="translate(231.3044 70.183628)">全向源搜索清除</text>
    <text style="font-size: 8px; font-family: 'SimSun', 'Microsoft YaHei', 'SimHei', 'DejaVu Sans', sans-serif; fill: #222222" transform="translate(215.3044 80.458628)">正负观测融合｜覆盖扫描</text>
    <text style="font-size: 8px; font-family: 'SimSun', 'Microsoft YaHei', 'SimHei', 'DejaVu Sans', sans-serif; fill: #222222" transform="translate(213.3044 90.77894)">100 m共享先导｜滚动路径</text>
    <text style="font-size: 8px; font-family: 'SimSun', 'Microsoft YaHei', 'SimHei', 'DejaVu Sans', sans-serif; fill: #222222" transform="translate(225.3044 101.099253)">认证清除+条带回退</text>
   </g>
   <g id="text_5">
    <text style="font-size: 8px; font-family: 'SimSun', 'Microsoft YaHei', 'SimHei', 'DejaVu Sans', sans-serif; fill: #222222" transform="translate(346.74 60.067221)">问题四</text>
    <text style="font-size: 8px; font-family: 'SimSun', 'Microsoft YaHei', 'SimHei', 'DejaVu Sans', sans-serif; fill: #222222" transform="translate(338.74 70.206284)">混合源扩展</text>
    <text style="font-size: 8px; font-family: 'SimSun', 'Microsoft YaHei', 'SimHei', 'DejaVu Sans', sans-serif; fill: #222222" transform="translate(330.74 80.481284)">定向可见性建模</text>
    <text style="font-size: 8px; font-family: 'SimSun', 'Microsoft YaHei', 'SimHei', 'DejaVu Sans', sans-serif; fill: #222222" transform="translate(326.74 90.665659)">覆盖加密为49节点</text>
    <text style="font-size: 8px; font-family: 'SimSun', 'Microsoft YaHei', 'SimHei', 'DejaVu Sans', sans-serif; fill: #222222" transform="translate(326.74 100.940659)">同一认证清除内核</text>
   </g>
   <g id="text_6">
    <text style="font-size: 8.4px; font-family: 'SimSun', 'Microsoft YaHei', 'SimHei', 'DejaVu Sans', sans-serif; fill: #222222" transform="translate(56.88 133.873385)">共用内核：位置可行集 P（圆域∩接收圆∩示向楔形→逐次求交，保留包含关系）</text>
    <text style="font-size: 8.4px; font-family: 'SimSun', 'Microsoft YaHei', 'SimHei', 'DejaVu Sans', sans-serif; fill: #222222" transform="translate(56.88 144.709713)">清除保证：最小包围圆 r≤19.9 m 认证清除；条带回退最坏距离 19.21 m &lt; 20 m</text>
   </g>
   <g id="text_7">
    <text style="font-size: 8px; font-family: 'SimSun', 'Microsoft YaHei', 'SimHei', 'DejaVu Sans', sans-serif; fill: #222222" transform="translate(77.6664 178.302651)">验证一：几何与数值</text>
    <text style="font-size: 8px; font-family: 'SimSun', 'Microsoft YaHei', 'SimHei', 'DejaVu Sans', sans-serif; fill: #222222" transform="translate(27.6664 188.532339)">构造反例（直径28.96681 m，漏覆盖0.26549 m）</text>
    <text style="font-size: 8px; font-family: 'SimSun', 'Microsoft YaHei', 'SimHei', 'DejaVu Sans', sans-serif; fill: #222222" transform="translate(25.6664 198.807339)">120个线性规划交叉核验（最大差7.1×10^-15 m）</text>
   </g>
   <g id="text_8">
    <text style="font-size: 8px; font-family: 'SimSun', 'Microsoft YaHei', 'SimHei', 'DejaVu Sans', sans-serif; fill: #222222" transform="translate(270.4936 178.325308)">验证二：任务表现</text>
    <text style="font-size: 8px; font-family: 'SimSun', 'Microsoft YaHei', 'SimHei', 'DejaVu Sans', sans-serif; fill: #222222" transform="translate(230.4936 188.554995)">190场配对试验（100%清除，改善5.77%）</text>
    <text style="font-size: 8px; font-family: 'SimSun', 'Microsoft YaHei', 'SimHei', 'DejaVu Sans', sans-serif; fill: #222222" transform="translate(230.4936 198.784683)">官方演练：全向5场、混合5场均100%清除</text>
   </g>
   <g id="text_9">
    <text style="font-size: 8.4px; font-family: 'SimSun', 'Microsoft YaHei', 'SimHei', 'DejaVu Sans', sans-serif; fill: #222222" transform="translate(82.08 225.373174)">结论边界：数值优选与时间结果限定于所测网格、场景与误差模型；</text>
    <text style="font-size: 8.4px; font-family: 'SimSun', 'Microsoft YaHei', 'SimHei', 'DejaVu Sans', sans-serif; fill: #222222" transform="translate(90.48 236.161924)">不宣称连续全局最优；正式测试未执行处明确标注为「未执行」</text>
   </g>
  </g>
 </g>
